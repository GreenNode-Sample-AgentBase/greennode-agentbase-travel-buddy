<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Buddy — trợ lý du lịch có trí nhớ</title>
  <meta name="description" content="Sample SPA: trợ lý du lịch GreenNode AgentBase với bộ nhớ dài hạn (memory strategies).">
  <meta property="og:title" content="Travel Buddy — GreenNode AgentBase sample">
  <meta property="og:description" content="Trợ lý du lịch có trí nhớ: Memory strategies + MCP Gateway (Tavily) + Policy, chạy trên GreenNode AgentBase.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Khung 3 cột: sidebar (người dùng/phiên) | chat | panel bộ nhớ -->
  <div id="layout">

    <!-- ===== CỘT TRÁI: người dùng &amp; phiên hội thoại ===== -->
    <aside class="sidebar" aria-label="Người dùng và phiên hội thoại">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">🧭</div>
        <div>
          <div class="brand-name">Travel Buddy</div>
          <div class="brand-sub">Trợ lý du lịch có trí nhớ</div>
        </div>
      </div>

      <section class="side-section">
        <div class="side-title">Người dùng</div>
        <div id="usersList" class="list"></div>
        <div class="side-form">
          <input id="newUserInput" class="side-input" type="text"
                 placeholder="Tên mới, vd: mai-le" autocomplete="off" spellcheck="false">
          <button id="newUserBtn" class="btn ghost small" type="button">+ Người dùng mới</button>
        </div>
      </section>

      <section class="side-section">
        <div class="side-title">Phiên hội thoại</div>
        <div id="sessionsList" class="list"></div>
        <button id="newSessionBtn" class="btn ghost small wide" type="button">+ Phiên mới</button>
      </section>

      <!-- Thông tin agent (GET /api/info) -->
      <div class="info-box" id="infoBox">
        <div class="info-title">ℹ️ Thông tin agent</div>
        <div class="info-line"><span>Agent</span><b id="infoAgent">—</b></div>
        <div class="info-line"><span>Memory ID</span><b id="infoMemory">—</b></div>
        <div class="info-line"><span>Model</span><b id="infoModel">—</b></div>
        <div class="info-line"><span>Gateway</span><b id="infoGateway">—</b></div>
      </div>
    </aside>

    <!-- ===== CỘT GIỮA: hội thoại ===== -->
    <main class="chat">
      <header class="chat-header">
        <div class="chips">
          <span class="chip" id="chipUser">@—</span>
          <span class="chip" id="chipSession">🆔 —</span>
          <span class="chip chip-status"><span class="dot" id="statusDot"></span>AgentBase</span>
        </div>
        <button id="memoryToggle" class="btn ghost small only-narrow" type="button">🧠 Bộ nhớ</button>
      </header>

      <!-- Bong bóng hội thoại được render bằng JS -->
      <div class="chat-messages" id="chatMessages" aria-live="polite"></div>

      <footer class="composer">
        <textarea id="composerInput" rows="1"
          placeholder="Nhập tin nhắn cho Travel Buddy… (Enter: gửi • Shift+Enter: xuống dòng)"></textarea>
        <button id="sendBtn" class="btn primary" type="button">Gửi ➤</button>
      </footer>
    </main>

    <!-- ===== CỘT PHẢI: bộ nhớ của agent ===== -->
    <aside class="memory-panel" id="memoryPanel" aria-label="Bộ nhớ của agent">
      <div class="panel-head">
        <div id="memoryTitle" class="panel-title">🧠 Bộ nhớ</div>
        <div class="panel-head-actions">
          <button id="memoryRefreshBtn" class="btn ghost small" type="button">⟳ Làm mới</button>
          <button id="panelClose" class="btn ghost small only-narrow" type="button" aria-label="Đóng panel">✕</button>
        </div>
      </div>

      <div class="panel-scroll">
        <!-- Nhóm memory records theo strategy (GET /api/memory) -->
        <div id="memoryBody" class="memory-body"></div>

        <section class="panel-section">
          <div class="panel-section-title">🕘 Hội thoại gần đây</div>
          <div id="recentList" class="recent-list"></div>
        </section>

        <!-- Giải thích ngắn về cơ chế bộ nhớ -->
        <div class="mem-explainer">
          Memory records được sinh tự động từ hội thoại (strategies CUSTOM + SEMANTIC)
          và lưu theo từng user (actorId).
        </div>
      </div>
    </aside>
  </div>

  <!-- Toast lỗi (tự ẩn sau 6s, có nút đóng) -->
  <div class="toast" id="toast" role="alert" aria-live="assertive">
    <span id="toastMsg"></span>
    <button id="toastClose" class="toast-close" type="button" aria-label="Đóng thông báo">✕</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
